<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Eksplore Sumba Timur</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page" data-page="login">
  <main class="login-shell">
    <section class="login-visual"></section>
    <section class="login-panel">
      <img src="assets/logo/logo_final.svg.svg" alt="Eksplore Sumba Timur">
      <h1>Selamat Datang Kembali</h1>
      <p>Senang melihatmu lagi! Masuk untuk melanjutkan petualanganmu di Sumba Timur</p>
      <form id="loginForm">
        <label>Email<input id="loginEmail" type="email" placeholder="nama@gmail.com" required></label>
        <label>Kata Sandi<input id="loginPassword" type="password" placeholder="Masukan kata sandi" required></label>
        <div class="login-row"><label><input type="checkbox" checked> Ingat saya</label><a href="#">Lupa kata sandi?</a></div>
        <button class="btn primary full" type="submit">Masuk</button>
        <span class="divider">atau masuk dengan</span>
        <button class="google-button" type="button" data-info="Login Google disimulasikan untuk tugas front-end.">G Masuk dengan Google</button>
        <p class="register-note">Belum punya akun? <button type="button" id="registerDemo">Daftar</button></p>
        <p class="form-message" id="authMessage"></p>
      </form>
    </section>
  </main>
  <footer class="login-footer">@2026 Eksplore Sumba Timur.All rights reserved. <span>Syarat & Ketentuan</span><span>Kebijakan Privasi</span></footer>
  <div class="toast" id="toast"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
