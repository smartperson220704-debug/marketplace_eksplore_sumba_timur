<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trip Planner - Eksplore Sumba Timur</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="planner">
  <header class="site-header">
    <a class="logo" href="index.html"><img src="assets/logo/logo_final.svg.svg" alt="Eksplore Sumba Timur"></a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="explore.html">Eksplore</a>
      <a class="nav-disabled active" aria-disabled="true">Trip Planner</a>
      <a href="#footer">About</a>
      <a href="#footer">Contact</a>
    </nav>
    <div class="header-icons"><button type="button" data-favorite>♡</button><button type="button" data-open-cart>♧</button></div>
  </header>
  <main class="container planner-page">
    <section class="planner-hero">
      <div><p>Trip Planner</p><h1>Susun rencana perjalanan Sumba Timur.</h1><span>Pilih destinasi, tambahkan ke rencana, lalu buka detail sebelum booking.</span></div>
      <button class="btn primary" data-open-cart>Lihat Rencana</button>
    </section>
    <div class="section-head"><h2>Rekomendasi untuk rencanamu</h2><a href="explore.html">Buka Marketplace ›</a></div>
    <div class="card-grid four" data-render="planner"></div>
  </main>
  <aside class="cart-drawer" id="cartDrawer"></aside>
  <footer class="site-footer" id="footer"></footer>
  <div class="toast" id="toast"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
